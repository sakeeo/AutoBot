name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
        env:
          # No code-signing certificate: skip the search for one. Windows SmartScreen will warn on the installer.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBot-windows
          path: dist/*.exe
          if-no-files-found: error
