appId: id.kerabatkoding.autobot
productName: AutoBot
copyright: Kerabat Koding
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - '**/*.node'
npmRebuild: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: AutoBot
linux:
  executableName: autobot
  synopsis: AutoBot — Balas WA Otomatis pakai AI
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: Kerabat Koding <dev@example.com>
